name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --x64 --publish never
      - name: 失败时把构建日志摘要暴露到 Step Summary（免登录可查）
        if: failure()
        shell: bash
        run: |
          LOG=$(ls -t ~/AppData/Local/electron-builder/Log/*.log ~/.log/electron-builder/*.log 2>/dev/null | head -1)
          [ -n "$LOG" ] && tail -c 4000 "$LOG" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows 构建失败，日志尾部见上方" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tomato-writer-app-windows
          path: dist-app/tomato-writer-app.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage --publish never
      - name: 失败时把构建日志摘要暴露到 Step Summary（免登录可查）
        if: failure()
        run: |
          LOG=$(ls -t ~/.log/electron-builder/*.log 2>/dev/null | head -1)
          [ -n "$LOG" ] && tail -c 4000 "$LOG" >> "$GITHUB_STEP_SUMMARY"
          echo "Linux 构建失败，日志尾部见上方" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tomato-writer-app-linux
          path: dist-app/*.AppImage

  # 推送 v* 标签（如 v0.1.0）时自动创建 Release 并附带安装包
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tomato-writer-app-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
