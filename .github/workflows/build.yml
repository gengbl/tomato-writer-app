name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: tomato-writer-app-windows
          path: dist-app/tomato-writer-app.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: tomato-writer-app-linux
          path: dist-app/*.AppImage

  # 推送 v* 标签（如 v0.1.0）时自动创建 Release 并附带安装包
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tomato-writer-app-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
